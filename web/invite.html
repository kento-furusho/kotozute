<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことづてへの招待</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
  .step { background: #fffdf8; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  .step b { display: block; margin-bottom: 4px; }
  .button { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
            font-weight: 700; padding: 12px 22px; border-radius: 999px; margin-top: 8px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 15px; background: #fff; border: 1px solid var(--line);
          border-radius: 8px; padding: 10px 12px; margin-top: 8px; word-break: break-all; user-select: all; }
  .copy { margin-top: 8px; font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 999px;
          padding: 6px 14px; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<main>

<h1>ことづてへの招待</h1>

<p class="lead">
「ことづて」は、大切な人と日々の「ありがとう」を書きためるアプリです。
</p>

<div class="step" id="open-step" hidden>
  <b>アプリをお持ちの方</b>
  このボタンからアプリを開くと、そのまま二人のペアが組まれます。
  <br><a class="button" id="open" href="#">アプリで開く</a>
</div>

<div class="step">
  <b>はじめての方</b>
  1. アプリをダウンロードしてください。
  <br><a class="button" href="https://apps.apple.com/jp/app/id6807755962">App Store で見る</a>
  <p style="margin:12px 0 0">2. 登録したら、このページに戻って「アプリで開く」を押してください。</p>
</div>

<div class="step" id="code-step" hidden>
  <b>リンクで開けないときは</b>
  アプリの「招待をもらっている」から、次のコードを入力してください。
  <div class="code" id="code"></div>
  <button class="copy" id="copy" type="button">コードをコピー</button>
</div>

<footer>
<p><a href="/">ことづてについて</a>　<a href="/support">サポート</a></p>
</footer>

</main>
<script>
  // トークンは URL（/invite/<トークン>）から読む。サーバーには問い合わせない。
  // 文字の種類を絞ってから textContent で入れる（URL に何を書かれても画面に式として解釈させない）。
  const token = location.pathname.replace(/^\/invite\/?/, "").replace(/\/$/, "");
  if (/^[A-Za-z0-9_-]{8,128}$/.test(token)) {
    // アプリで開くボタンは独自スキームのリンクにする。ユニバーサルリンクは
    // LINE などのアプリ内ブラウザや、iPhone 側の状態によっては働かず、このページが出る。
    // 独自スキームなら、アプリが入っていればどのブラウザからでも開ける。
    document.getElementById("open").href = "kotozute://invite/" + token;
    document.getElementById("open-step").hidden = false;
    document.getElementById("code").textContent = token;
    document.getElementById("code-step").hidden = false;
    document.getElementById("copy").addEventListener("click", async (event) => {
      try {
        await navigator.clipboard.writeText(token);
        event.target.textContent = "コピーしました";
      } catch {
        event.target.textContent = "長押しでコピーしてください";
      }
    });
  }
</script>
</body>
</html>
