AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kotozute

  Sample SAM Template for kotozute

Parameters:
  # SNS のプラットフォームアプリケーション（APNs）の ARN。
  # APNs の認証キーを Apple Developer で発行し、SNS に登録して初めて作れる。
  # それまでは空のままでよく、そのとき PATCH /me は端末を登録せず
  # apnsToken の保存だけを行う（通知は飛ばない）。
  # 設定するときは: sam deploy --parameter-overrides SnsPlatformApplicationArn=arn:aws:sns:...
  # 配布ビルド（TestFlight / App Store）の端末が登録される先。
  SnsPlatformApplicationArn:
    Type: String
    Default: ""
    Description: "SNS platform application ARN for APNs (production). Empty disables device registration."
  # 開発ビルド（Xcode から実機に入れたもの）の端末が登録される先。
  # 1つのバックエンドが両方を相手にするので、端末が自分の環境を送ってきて選ぶ。
  SnsPlatformApplicationArnSandbox:
    Type: String
    Default: ""
    Description: "SNS platform application ARN for APNs sandbox. Empty disables registration for debug builds."
  # 確認コードの差出人。SES で検証したドメインのアドレスにする。
  # 空のときは Cognito のデフォルト送信のまま（1日50通・汎用の差出人）。
  # SES がまだ検証中／サンドボックスのうちは空で運用できる。
  VerifiedSenderEmail:
    Type: String
    Default: ""
    Description: "Verified SES address used as the From of Cognito emails. Empty keeps Cognito default sending."
  VerifiedSenderArn:
    Type: String
    Default: ""
    Description: "ARN of the verified SES identity. Required when VerifiedSenderEmail is set."

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
  Api:
    Auth:
      # Cognito の門番を「定義」する（まだどのエンドポイントにも割り当てていない）。
      # UserPoolArn で「この User Pool が発行したトークンだけを本物と認める」門番になる。
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt KotozuteUserPool.Arn

Conditions:
  # 差出人が指定されているときだけ SES 経由にする。
  # 指定が無ければ Cognito のデフォルト送信を使い、デプロイは通る。
  UseSes: !Not [!Equals [!Ref VerifiedSenderEmail, ""]]

Resources:
  # メインテーブル（Single Table Design）。USER / PAIR / KOTOZUTE / INVITE を PK・SK で使い分ける。
  # テーブル名は各 Lambda が const tableName = "kotozute" で直接参照しているため明示指定する
  # （省略すると CloudFormation がランダムな接尾辞付きの名前を付けてコードと食い違う）。
  KotozuteTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kotozute
      # 常時アクセスのない個人開発なので、キャパシティ予約せず使った分だけ払う。
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        # GSI1 のキー。属性定義に載せるのはキーに使う属性だけでよい。
        - AttributeName: openDayOfWeek
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI①（曜日）: 週一バッチが「今日オープンすべきペア」を引くための索引。
        # openDayOfWeek を持つのは PAIR の META だけなので、索引には自然とペアだけが載る（スパース索引）。
        # Projection=ALL にして、バッチが member1/member2/cycleStartedAt/cycleStarts を追加読み込みなしで得られるようにする。
        - IndexName: GSI1
          KeySchema:
            - AttributeName: openDayOfWeek
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      # GSI②（メール）はログイン実装時に追加する。現状コードから参照していないため定義しない。

  # Cognito ユーザープール（ユーザーの入れ物）。メール＋パスワードでログインできるようにする。
  KotozuteUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kotozute-users
      # 確認メールの送信元。SES 経由にすると Cognito の1日50通の上限から外れ、
      # 独自ドメインの差出人になるので迷惑メール扱いされにくい。
      # 差出人が未指定のときは丸ごと省略して、デフォルト送信のままにする。
      EmailConfiguration: !If
        - UseSes
        - EmailSendingAccount: DEVELOPER
          From: !Sub "ことづて <${VerifiedSenderEmail}>"
          SourceArn: !Ref VerifiedSenderArn
        - !Ref AWS::NoValue
      # ユーザー名の代わりにメールアドレスでログインさせる。
      UsernameAttributes:
        - email
      # サインアップ時にメール宛の確認コードで本人確認する（メールを自動で検証対象にする）。
      AutoVerifiedAttributes:
        - email
      # 確認コードのメール。既定は英語なので日本語にする。
      # ここはシステムからの通知なので丁寧語にする（画面の説明は常体、という決めごとの例外）。
      # {####} がコードに置き換わる。この置き換え文字が無いと CloudFormation が弾く。
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "ことづて｜確認コード"
        EmailMessage: |
          <p>ことづての確認コードです。</p>
          <p style="font-size:24px; font-weight:bold; letter-spacing:4px;">{####}</p>
          <p>アプリの画面に入力してください。</p>
          <p style="color:#8A7B6C; font-size:13px;">心当たりがない場合は、このメールを破棄してください。</p>
      # パスワードの最低条件。学習段階なので緩め（8文字以上・小文字・数字）にしておく。
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  # アプリクライアント（iOSアプリがこのユーザープールを使うための窓口）。
  KotozuteUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: kotozute-ios
      UserPoolId: !Ref KotozuteUserPool
      # モバイルアプリ（公開クライアント）はシークレットを持てないので発行しない。
      GenerateSecret: false
      # 許可するログイン方式。SRP（安全なパスワード認証）＋リフレッシュトークン更新を許可。
      # USER_PASSWORD_AUTH はCLIから動作確認するとき用（本番のiOSはSRPを使う）。
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  PostKotozuteFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/post-kotozute/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        PostKotozute:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /kotozute
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
        Variables:
          DYNAMODB_ENDPOINT: ""

  GetArchiveFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/get-archive/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBReadPolicy:
            TableName: kotozute
      Events:
        GetArchive:
          Type: Api
          Properties:
            Path: /kotozute/archive
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  GetThisWeekFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/get-this-week/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBReadPolicy:
            TableName: kotozute
      Events:
        GetThisWeek:
          Type: Api
          Properties:
            Path: /kotozute/this-week
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  PostUsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/post-users/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        PostUsers:
          Type: Api
          Properties:
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  GetMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/get-me/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBReadPolicy:
            TableName: kotozute
      Events:
        GetMe:
          Type: Api
          Properties:
            Path: /me
            Method: GET
            # このエンドポイントにだけ Cognito の門番を立たせる。
            # トークンが無い/偽物なら API Gateway が 401 で弾き、Lambda は呼ばれない。
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  PatchKotozuteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/patch-kotozute/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        PatchKotozute:
          Type: Api
          Properties:
            Path: /kotozute/{id}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  # DELETE /me（アカウント削除）。App Store の要件。
  # 消すのは自分のデータだけ。相手が書いたことづては相手のものなので触らない。
  DeleteMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/delete-me/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      # ことづてが多いと消すのに時間がかかる。API 関数の既定（5秒）では足りない。
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
        # Cognito のユーザーを消す。アカウントが残ると「消したのにログインできる」状態になる。
        - Statement:
            - Sid: AllowDeleteCognitoUser
              Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt KotozuteUserPool.Arn
        # 端末の登録も落とす。残すと消えたユーザー宛に配信を試み続ける。
        - Statement:
            - Sid: AllowDeleteSNSEndpoint
              Effect: Allow
              Action:
                - sns:DeleteEndpoint
              Resource: "*"
      Events:
        DeleteMe:
          Type: Api
          Properties:
            Path: /me
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""
          USER_POOL_ID: !Ref KotozuteUserPool

  PatchMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/patch-me/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
        # 端末のトークンを SNS に登録して、通知の宛先（エンドポイントARN）を作る権限。
        # 既に同じトークンのエンドポイントがある場合は属性を入れ直すので Set も要る。
        - Statement:
            - Sid: AllowSNSEndpointRegistration
              Effect: Allow
              Action:
                - sns:CreatePlatformEndpoint
                - sns:SetEndpointAttributes
                - sns:GetEndpointAttributes
              Resource: "*"
      Events:
        PatchMe:
          Type: Api
          Properties:
            Path: /me
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""
          SNS_PLATFORM_APPLICATION_ARN: !Ref SnsPlatformApplicationArn
          SNS_PLATFORM_APPLICATION_ARN_SANDBOX: !Ref SnsPlatformApplicationArnSandbox

  # DELETE /pair（ペア解消）。アカウントは残る。
  # 解消の時刻を両者に刻み、次のペアの区切りの下限にする。
  DeletePairFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/delete-pair/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        DeletePair:
          Type: Api
          Properties:
            Path: /pair
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  PatchPairFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/patch-pair/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        PatchPair:
          Type: Api
          Properties:
            Path: /pair
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  GetPairFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/get-pair/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBReadPolicy:
            TableName: kotozute
      Events:
        GetPair:
          Type: Api
          Properties:
            Path: /pair
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  PostInvitesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/post-invites/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
      Events:
        PostInvites:
          Type: Api
          Properties:
            Path: /invites
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  GetInviteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/get-invite/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBReadPolicy:
            TableName: kotozute
      Events:
        GetInvite:
          Type: Api
          Properties:
            Path: /invites/{token}
            Method: GET
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  PostInviteAcceptFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/post-invite-accept/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
        # DynamoDBCrudPolicyはTransactWriteItemsを含まないため個別に許可する（招待受諾はトランザクションで複数アイテムを同時更新するため）。
        - Statement:
            - Sid: AllowTransactWriteItems
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kotozute"
      Events:
        PostInviteAccept:
          Type: Api
          Properties:
            Path: /invites/{token}/accept
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

  # 週一オープンのバッチ。EventBridge が定期起動する（API Gateway からは呼ばれない）。
  WeeklyOpenFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: functions/weekly-open/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      # 一括更新でやや時間がかかりうるので、API 関数より長めのタイムアウトにする。
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: kotozute
        # 通知は SNS→APNs。ユーザーのエンドポイントARNへ Publish する権限。
        - Statement:
            - Sid: AllowSNSPublish
              Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            # 毎正時に起動し、その時刻にオープンすべきペアを探す。
            # 二重オープン防止（lastOpenedAt 判定）があるため、毎時走っても1サイクル1回に収まる。
            Schedule: cron(0 * * * ? *)
            Name: kotozute-weekly-open-hourly
            Description: "kotozute weekly open batch (hourly)"
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""

Outputs:
  # iOSアプリの設定に必要な2つのID。デプロイ後、これらをiOS側に渡してCognitoログインを構成する。
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref KotozuteUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID (iOS)"
    Value: !Ref KotozuteUserPoolClient

  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  KotozuteApi:
    Description: "API Gateway endpoint URL for Prod environment for POST /kotozute"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/kotozute/"
  PostKotozuteFunction:
    Description: "Post Kotozute Lambda Function ARN"
    Value: !GetAtt PostKotozuteFunction.Arn
  PostKotozuteFunctionIamRole:
    Description: "Implicit IAM Role created for Post Kotozute function"
    Value: !GetAtt PostKotozuteFunctionRole.Arn
  GetThisWeekFunction:
    Description: "Get This Week Lambda Function ARN"
    Value: !GetAtt GetThisWeekFunction.Arn
  GetThisWeekFunctionIamRole:
    Description: "Implicit IAM Role created for Get This Week function"
    Value: !GetAtt GetThisWeekFunctionRole.Arn
  PostUsersFunction:
    Description: "Post Users Lambda Function ARN"
    Value: !GetAtt PostUsersFunction.Arn
  PostUsersFunctionIamRole:
    Description: "Implicit IAM Role created for Post Users function"
    Value: !GetAtt PostUsersFunctionRole.Arn
  GetMeFunction:
    Description: "Get Me Lambda Function ARN"
    Value: !GetAtt GetMeFunction.Arn
  GetMeFunctionIamRole:
    Description: "Implicit IAM Role created for Get Me function"
    Value: !GetAtt GetMeFunctionRole.Arn
  PostInvitesFunction:
    Description: "Post Invites Lambda Function ARN"
    Value: !GetAtt PostInvitesFunction.Arn
  PostInvitesFunctionIamRole:
    Description: "Implicit IAM Role created for Post Invites function"
    Value: !GetAtt PostInvitesFunctionRole.Arn
  GetInviteFunction:
    Description: "Get Invite Lambda Function ARN"
    Value: !GetAtt GetInviteFunction.Arn
  GetInviteFunctionIamRole:
    Description: "Implicit IAM Role created for Get Invite function"
    Value: !GetAtt GetInviteFunctionRole.Arn
  PostInviteAcceptFunction:
    Description: "Post Invite Accept Lambda Function ARN"
    Value: !GetAtt PostInviteAcceptFunction.Arn
  PostInviteAcceptFunctionIamRole:
    Description: "Implicit IAM Role created for Post Invite Accept function"
    Value: !GetAtt PostInviteAcceptFunctionRole.Arn
